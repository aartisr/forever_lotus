<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="fl-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#07080f" />
    </radialGradient>
    <linearGradient id="fl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcedb4" />
      <stop offset="40%" stop-color="#d4b45d" />
      <stop offset="100%" stop-color="#9a7620" />
    </linearGradient>
    <linearGradient id="fl-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8b6ce" />
      <stop offset="100%" stop-color="#d1608f" />
    </linearGradient>
    <radialGradient id="fl-seed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="50%" stop-color="#e0b957" />
      <stop offset="100%" stop-color="#8c6414" />
    </radialGradient>
    <filter id="fl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle for Contrast on light/dark browser tabs -->
  <circle cx="60" cy="60" r="58" fill="url(#fl-bg)" stroke="#d4b45d" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Outer 8 Golden Petals -->
  <g transform="translate(60,60)" filter="url(#fl-glow)">
    <!-- Petal 0 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" />
    <!-- Petal 45 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(45)" />
    <!-- Petal 90 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(90)" />
    <!-- Petal 135 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(135)" />
    <!-- Petal 180 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(180)" />
    <!-- Petal 225 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(225)" />
    <!-- Petal 270 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(270)" />
    <!-- Petal 315 -->
    <path d="M 0 0 C -8 -22, -6 -44, 0 -52 C 6 -44, 8 -22, 0 0" fill="url(#fl-gold)" transform="rotate(315)" />

    <!-- Inner 8 Rose & Light Gold Petals -->
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(22.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(67.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(112.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(157.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(202.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(247.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(292.5)" />
    <path d="M 0 0 C -6 -16, -4 -32, 0 -38 C 4 -32, 6 -16, 0 0" fill="url(#fl-rose)" transform="rotate(337.5)" />

    <!-- Core Golden Seed & Bindu -->
    <circle cx="0" cy="0" r="10" fill="url(#fl-seed)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="0.8" />
    <circle cx="0" cy="0" r="3.5" fill="#382103" />
  </g>

  <!-- Serene Foundation Water Ripple Arc -->
  <path d="M 30 94 C 44 88, 52 87, 60 89 C 68 87, 76 88, 90 94" stroke="#7cc2b7" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>
